name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify migrations reproduce the schema
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow \
            --exit-code

  helm:
    name: Helm lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5
        with:
          version: v3.18.6

      - name: Fetch subcharts
        run: helm dependency build deploy/helm

      - name: Lint
        run: helm lint deploy/helm --values deploy/helm/ci/full-values.yaml

      - name: Render with all features enabled
        # Written inside the workspace, which is the only path the kubeconform container can see.
        run: helm template ci deploy/helm --values deploy/helm/ci/full-values.yaml > helm-rendered.yaml

      - name: Render with defaults
        run: |
          helm template ci deploy/helm \
            --set secrets.databaseUrl=postgresql://notes:pw@db:5432/notes \
            --set secrets.redisUrl=redis://redis:6379 \
            --set secrets.sessionSecret=0123456789abcdef0123456789abcdef0123456789abcdef \
            --set secrets.defaultAdminPassword=ci-test-password \
            > /dev/null

      - name: Reject placeholder credentials
        run: |
          # The chart must refuse to render without real secrets rather than shipping a default.
          if helm template ci deploy/helm > /dev/null 2>&1; then
            echo "::error::Chart rendered without secrets being supplied"
            exit 1
          fi

      - name: Validate manifests against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:latest-alpine
        with:
          args: -strict -summary -ignore-missing-schemas helm-rendered.yaml

  images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: notes-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notes-${{ matrix.component }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Advisory only: a new upstream advisory should not block an unrelated PR.
      - run: npm audit --audit-level=critical --omit=dev
        continue-on-error: true
