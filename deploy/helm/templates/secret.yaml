{{- if not .Values.secrets.existingSecret }}
{{- $databaseUrl := .Values.secrets.databaseUrl }}
{{- if .Values.postgresql.enabled }}
{{- $databasePassword := required "postgresql.auth.password is required when postgresql.enabled is true" .Values.postgresql.auth.password }}
{{- $databaseUrl = printf "postgresql://%s:%s@%s-postgresql:5432/%s?schema=public" .Values.postgresql.auth.username $databasePassword .Release.Name .Values.postgresql.auth.database }}
{{- end }}
{{- $redisUrl := .Values.secrets.redisUrl }}
{{- if .Values.redis.enabled }}
{{- $redisHost := printf "%s-redis-master" .Release.Name }}
{{- if .Values.redis.auth.enabled }}
{{- $redisPassword := required "redis.auth.password is required when redis.enabled and redis.auth.enabled are true" .Values.redis.auth.password }}
{{- $redisUrl = printf "redis://:%s@%s:6379" $redisPassword $redisHost }}
{{- else }}
{{- $redisUrl = printf "redis://%s:6379" $redisHost }}
{{- end }}
{{- end }}

{{- if not $databaseUrl }}{{ fail "Set secrets.databaseUrl (or enable the bundled postgresql subchart, or supply secrets.existingSecret)." }}{{ end }}
{{- if not $redisUrl }}{{ fail "Set secrets.redisUrl (or enable the bundled redis subchart, or supply secrets.existingSecret)." }}{{ end }}

{{/*
The session secret signs self-contained auth cookies, so a placeholder value is a full account
takeover. Reuse the previously generated value on upgrade so existing sessions survive.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "notes.fullname" .)) }}
{{- $sessionSecret := .Values.secrets.sessionSecret }}
{{- if not $sessionSecret }}
{{- if and $existing $existing.data.SESSION_SECRET }}
{{- $sessionSecret = b64dec $existing.data.SESSION_SECRET }}
{{- else }}
{{- $sessionSecret = randAlphaNum 64 }}
{{- end }}
{{- end }}
{{- if lt (len $sessionSecret) 32 }}{{ fail "secrets.sessionSecret must be at least 32 characters. Generate one with: openssl rand -base64 48" }}{{ end }}

{{- $adminPassword := .Values.secrets.defaultAdminPassword }}
{{- if and (not $adminPassword) $existing $existing.data.DEFAULT_ADMIN_PASSWORD }}
{{- $adminPassword = b64dec $existing.data.DEFAULT_ADMIN_PASSWORD }}
{{- end }}
{{- if not $adminPassword }}{{ fail "Set secrets.defaultAdminPassword to at least 12 characters. It seeds the first admin account and must be changed at first sign-in." }}{{ end }}
{{- if lt (len $adminPassword) 12 }}{{ fail "secrets.defaultAdminPassword must be at least 12 characters." }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notes.fullname" . }}-secrets
  labels:
    {{- include "notes.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $databaseUrl | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
  SESSION_SECRET: {{ $sessionSecret | quote }}
  DEFAULT_ADMIN_PASSWORD: {{ $adminPassword | quote }}
{{- if .Values.oidc.enabled }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
{{- end }}
{{- if .Values.llm.enabled }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
{{- end }}
{{- end }}
